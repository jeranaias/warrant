<path d="M270.0,266.0 H272.4 Q274.9,266.0 274.9,268.4 V293.6 Q274.9,296.0 272.4,296.0 H270.0 Z" fill="#2a78d6"/>
<text x="286.9" y="281.0" font-size="17" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">1  (1%)</text>
<text x="40.0" y="332.0" font-size="13" font-weight="400" fill="#898781" text-anchor="start" dominant-baseline="middle">Per attack, the layer that stopped most of its proposals. Scripted agent; source: pnpm bench.</text>
