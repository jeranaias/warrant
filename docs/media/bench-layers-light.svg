<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 354" width="960" height="354" role="img" aria-label="What stopped the 150 blocked attacks" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
<title>What stopped the 150 blocked attacks</title>
<rect width="960" height="354" fill="#fcfcfb"/>
<text x="40.0" y="40.0" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="middle">What stopped the 150 blocked attacks</text>
<text x="40.0" y="74.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="middle">The Warrant layer that stopped each attack: rules in code alone stop 74%, with no model or person asked</text>
