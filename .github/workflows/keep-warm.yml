name: Keep demo warm

# The hosted demo runs on a free Render instance that sleeps after 15 minutes without traffic,
# and the first visit after that takes up to a minute. During judging, a ping every 5 minutes
# keeps it awake. /api/health needs no login and starts no session.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hosted demo
        run: curl -fsS --retry 4 --retry-delay 15 --retry-all-errors --max-time 90 https://warrant-demo-bt31.onrender.com/api/health
